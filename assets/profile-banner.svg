  </linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#3a1428" flood-opacity=".35"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#ffeaf0" stroke-opacity=".08"/></pattern>
</defs>
<rect width="1200" height="400" rx="26" fill="url(#bg)"/><rect width="1200" height="400" rx="26" fill="url(#grid)"/>
